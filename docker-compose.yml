services:

  postgres:
    image: postgres:17
    container_name: devops-postgres

    environment:
      POSTGRES_DB: devops_app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./api/db/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d devops_app"]
      interval: 5s
      timeout: 5s
      retries: 10


  rabbitmq:
    image: rabbitmq:4-management
    container_name: devops-rabbitmq

    ports:
      - "5672:5672"
      - "15672:15672"

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10


  redis:
    image: redis:7
    container_name: devops-redis

    ports:
      - "6379:6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10


  api:
    build:
      context: ./api

    container_name: devops-api

    environment:
      PORT: 3000

      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: devops_app
      DB_USER: postgres
      DB_PASSWORD: postgres

      RABBITMQ_URL: amqp://rabbitmq:5672
      REDIS_URL: redis://redis:6379

    ports:
      - "3000:3000"

    depends_on:
      postgres:
        condition: service_healthy

      rabbitmq:
        condition: service_healthy

      redis:
        condition: service_healthy


  worker:
    build:
      context: ./worker

    container_name: devops-worker

    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: devops_app
      DB_USER: postgres
      DB_PASSWORD: postgres

      RABBITMQ_URL: amqp://rabbitmq:5672
      REDIS_URL: redis://redis:6379

    depends_on:
      postgres:
        condition: service_healthy

      rabbitmq:
        condition: service_healthy

      redis:
        condition: service_healthy


  frontend:
    build:
      context: ./frontend

    container_name: devops-frontend

    ports:
      - "8080:80"

    depends_on:
      api:
        condition: service_started


volumes:
  postgres_data: