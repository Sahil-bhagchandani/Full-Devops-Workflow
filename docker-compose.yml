services:
  postgres:
    image: postgres:17
    container_name: devops-postgres
    environment:
      POSTGRES_DB: devops_app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./api/db/init:/docker-entrypoint-initdb.d:ro
  
  rabbitmq:
    image: rabbitmq:4-management
    container_name: devops-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
volumes:
  postgres_data:
