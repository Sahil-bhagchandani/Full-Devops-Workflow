apiVersion: apps/v1 
kind: Deployment
metadata:
  name: rabbitmq-deployment
  namespace: jobs-lab
spec:
  replicas: 1
  selector: 
    matchLabels:
      app: devops-rabbitmq
  template:
    metadata:
      labels:
        app: devops-rabbitmq
    spec:
      containers:
      - name: devops-rabbitmq 
        image: rabbitmq:4-management
        ports:
        - name: amqp
          containerPort: 5672
        - name: web-ui
          containerPort: 15672
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "200m"   
        readinesProbe:
          exec:
            command: 
              - rabbitmq-diagnostics
              - -q
              - ping
          initialDelaySeconds: 15
          timeoutSeconds: 15
          periodSeconds: 20
          failureThreshold: 5

