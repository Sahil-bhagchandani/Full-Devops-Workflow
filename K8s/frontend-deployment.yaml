apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-frontend
  namespace: jobs-lab
spec:
  replicas: 2
  selector: 
    matchLabels:
      app: devops-frontend
  template:
    metadata:
      labels:
        app: devops-frontend
    spec:
      imagePullSecrets: 
      - name: acr-pull
      containers:
      - name: devops-frontend
        image: devworkflowimages.azurecr.io/devops/frontend:v1.0.0
        ports:
        - containerPort: 80
        resources:
          requests: 
            memory: "60Mi"
            cpu: "30m"
          limits:
            memory: "120Mi"
            cpu: "60m"
        readinessProbe:
          httpGet:
            port: 80
            path: /
        
