apiVersion: apps/v1
kind: Deployment
metadata: 
  name: worker
  namespace: jobs-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-worker
  template:
    metadata:
      labels:
        app: devops-worker
    spec:
      imagePullSecrets: 
      - name: acr-pull
      containers:
      - name: devops-worker
        image: devworkflowimages.azurecr.io/devops/worker:v1.0.0
        envFrom:
        - configMapRef:
            name: app-config
        env:
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_PASSWORD
        resources:
          requests:
            memory: "50Mi"
            cpu: "50m"
          limits:
            memory: "100Mi"
            cpu: "200m"
                
