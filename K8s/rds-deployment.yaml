apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-deployment
  namespace: jobs-lab
spec:
  replicas: 1
  selector: 
    matchLabels:
      app: devops-redis
  template:
    metadata: 
      labels:
        app: devops-redis
    spec:
      containers:
      - name: devops-redis
        image: redis:7    
        ports:
        - containerPort: 6379    
        resources:
          requests:
            memory: "64Mi"
            cpu: "30m"
          limits:
            memory: "120Mi"
            cpu: "60m"
        readinessProbe:
          exec:
            command:
              - redis-cli
              - ping
          initialDelaySeconds: 5
          periodSeconds: 10
