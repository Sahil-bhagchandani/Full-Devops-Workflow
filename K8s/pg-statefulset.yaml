apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-0
  namespace: jobs-lab
spec:
  serviceName: pg-service
  replicas: 2
  selector:
    matchLabels:
      app: postgres-0
  template:
    metadata:
      labels:
        app: postgres-0
    spec:
      containers:
      - name: postgres-0
        image: postgres:17
        readinessProbe:
          exec:
            command:
            - pg_isready -U postgres
          initialDelaySeconds: 10
          periodSeconds: 10
        volumeMounts:  
        - name: pg-data
          mountPath: /var/lib/postgresql/data
        env:
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        - name: db_password
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: db_password
        ports:
        - containerPort: 5432
          name: postgres
  volumeClaimTemplates: 
  - metadata:
      name: postgres-pvc
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: "1Gi"  

