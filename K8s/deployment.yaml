apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: jobs-lab
  name: my-dep
  labels:
    app: my-dep
spec:
  replicas: 2
  selector:
    matchLabels:
      app: my-dep
  template:
    metadata:
      labels:
        app: my-dep
    spec:
      containers:
      - name: nginx
        image: nginx:1.27
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "200Mi"
            cpu: "120m"
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 15
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 10
          failureThreshold: 2
        ports:
        - containerPort: 80
        envFrom:
        - configMapRef: 
            name: my-config
        env: 
        - name: db_password
          valueFrom:
            secretKeyRef:
              name: my-secret
              key: db_password

